name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Unit tests on every supported Node version.
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  # The E2E tests run against a real, throwaway Linkwarden instance rather than mocked responses.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned in .linkwarden-version so upstream releases can't break CI unannounced.
      - name: 📌 Read pinned Linkwarden version
        run: echo "LINKWARDEN_VERSION=$(tr -d '[:space:]' < .linkwarden-version)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 🐳 Start Linkwarden
        run: |
          scripts/dev-linkwarden.sh up
          scripts/dev-linkwarden.sh env | sed 's/^export //; s/"//g' >> "$GITHUB_ENV"
      - run: pnpm test
      - name: 📜 Linkwarden logs
        if: failure()
        run: docker compose logs linkwarden
