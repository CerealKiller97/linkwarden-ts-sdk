name: typecheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # `tsc` is TypeScript 7 (installed as @typescript/native); see package.json.
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 🔎 Typecheck sources and tests
        run: pnpm typecheck
      - name: 📦 Check the build emits
        run: pnpm build
      # The release publishes with npm, which enforces package.json rules pnpm doesn't
      # (such as devEngines), so check with the same npm version on every pull request.
      - name: 🚚 Check npm can publish the package
        run: npx --yes npm@^11.5.1 publish --dry-run --access public
