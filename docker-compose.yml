# Throwaway Linkwarden instance that the SDK tests run against.
# Managed by scripts/dev-linkwarden.sh — run `scripts/dev-linkwarden.sh up`.
# Copy .env.example to .env (or let the script generate one) before starting.
name: linkwarden-ts-sdk-dev

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    env_file: .env
    restart: unless-stopped
    volumes:
      - meili_data:/meili_data

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:${LINKWARDEN_VERSION:-latest}
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      - MEILI_HOST=http://meilisearch:7700
    restart: unless-stopped
    ports:
      - "${LINKWARDEN_PORT:-3000}:3000"
    volumes:
      - data:/data/data
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started

volumes:
  pgdata:
  meili_data:
  data:
